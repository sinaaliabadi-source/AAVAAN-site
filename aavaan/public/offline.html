<!DOCTYPE html>
<!-- صفحه‌ی آفلاین آوان — کاملاً مستقل و بدون هیچ فایل خارجی (CSS/فونت/تصویر). -->
<!-- تمام استایل‌ها به‌صورت inline نوشته شده‌اند تا حتی بدون اینترنت هم درست نمایش داده شود. -->
<html dir="rtl" lang="fa-IR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1F2A44">
    <title>آوان — اتصال اینترنت برقرار نیست</title>
</head>
<body style="margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F6F1E7;color:#232323;font-family:Tahoma,'Segoe UI',sans-serif;direction:rtl;text-align:center;padding:24px;box-sizing:border-box;">

    <main style="max-width:420px;width:100%;">

        <!-- لوگوی متنی «آوان» با رنگ لاجوردی برند -->
        <div style="font-size:56px;font-weight:800;color:#1F2A44;letter-spacing:2px;margin-bottom:8px;">آوان</div>

        <!-- خط طلایی تزئینی -->
        <div style="width:64px;height:4px;background:#C9A24B;border-radius:2px;margin:0 auto 28px;"></div>

        <!-- پیام اصلی -->
        <h1 style="font-size:22px;font-weight:700;color:#1F2A44;margin:0 0 12px;">اتصال اینترنت برقرار نیست</h1>

        <p style="font-size:15px;line-height:2;color:#5b5b5b;margin:0 0 28px;">
            به‌نظر می‌رسد دستگاه شما به اینترنت متصل نیست.
            لطفاً اتصال خود را بررسی کنید و دوباره تلاش کنید.
        </p>

        <!-- دکمه‌ی تلاش مجدد -->
        <button onclick="location.reload()" style="display:inline-block;background:#1F2A44;color:#F6F1E7;border:none;border-radius:8px;padding:12px 28px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;">
            تلاش مجدد
        </button>

        <!-- شعار برند -->
        <p style="margin-top:40px;font-size:14px;font-weight:700;color:#C9A24B;letter-spacing:1px;">زمانش رسید</p>

    </main>

</body>
</html>
