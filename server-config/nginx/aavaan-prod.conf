server {
    listen 80;
    server_name aavaan.com www.aavaan.com;
    root /var/www/aavaan/public;
    index index.php;

    client_max_body_size 50M;

    # گزینه‌ها برای فایل‌های استاتیک (تصاویر و assets)
    location ~* \.(jpg|jpeg|png|gif|webp|ico|css|js|woff|woff2|ttf|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
    }

    # جلوگیری از دسترسی به .env
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # لاگ‌ها
    access_log /var/log/nginx/aavaan-access.log;
    error_log /var/log/nginx/aavaan-error.log;
}
